<body class="page-print">

        <img src="img/汉字logo.png" alt="卡通汉字logo" class="logo">

    <div class="container">
        <div class="content-wrapper">
            <h1 class="page-title">活字印刷工坊</h1>

            <div class="text-box">
                <p style="font-size: 25px; text-align: center; font-family: 'Comic Sans MS', '幼圆', '微软雅黑 Light', sans-serif; font-weight: bold;">
                    北宋的毕昇发明了活字印刷术：把一个个字做成活字块，排好顺序、刷上墨，就能印出整篇文章！<br>
                    现在轮到你当一回小小印刷匠——点击活字块，把诗句排进印盘吧！
                </p>
            </div>

            <div class="print-shop">
                <h2 class="section-title" style="text-align: center; border-left: none; padding-left: 0;">第一步：排版</h2>
                <p style="font-size: 16px; color: #a86932;">点击下方活字块，按诗句的正确顺序填入印盘；点印盘里的字可以退回。</p>

                <!-- 印盘 -->
                <div class="print-board" id="printBoard"></div>

                <!-- 活字块 -->
                <div class="movable-type-box" id="typeBox"></div>

                <div class="btn-group" style="margin: 18px 0 6px;">
                    <button class="theme-btn" id="inkBtn">刷墨印刷</button>
                    <button class="theme-btn" id="resetBtn">重新排版</button>
                    <button class="theme-btn" id="nextBtn">换一首诗</button>
                </div>

                <div class="print-message" id="printMsg"></div>

                <!-- 卷轴印成品 -->
                <div class="print-scroll-area" id="scrollArea">
                    <div class="print-result-text" id="printResult"></div>
                </div>
                <p class="poem-source" id="poemSource"></p>
            </div>

            <p style="text-align: center; font-size: 14px; color: #a86932; margin-top: 30px;">资料来源：活字印刷术相关史实参考《梦溪笔谈》中关于毕昇的记载；诗句出处见印刷成品下方标注。</p>
        </div>
    </div>

    <div class="footer">
        <p>汉字成长记</p>
    </div>

    <script src="./js/main.js"></script>
    <script>
    (function () {
        const poems = [
            { text: "床前明月光", source: "—— 唐 · 李白《静夜思》" },
            { text: "锄禾日当午", source: "—— 唐 · 李绅《悯农》" },
            { text: "春眠不觉晓", source: "—— 唐 · 孟浩然《春晓》" },
            { text: "更上一层楼", source: "—— 唐 · 王之涣《登鹳雀楼》" }
        ];

        const board = document.getElementById("printBoard");
        const typeBox = document.getElementById("typeBox");
        const inkBtn = document.getElementById("inkBtn");
        const resetBtn = document.getElementById("resetBtn");
        const nextBtn = document.getElementById("nextBtn");
        const msg = document.getElementById("printMsg");
        const scrollArea = document.getElementById("scrollArea");
        const printResult = document.getElementById("printResult");
        const poemSource = document.getElementById("poemSource");

        let current = null;
        let slots = []; // 每格：{ char } 或 null

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function loadPoem(poem) {
            current = poem;
            slots = new Array(poem.text.length).fill(null);
            scrollArea.classList.remove("printed");
            printResult.textContent = "";
            poemSource.textContent = "";
            msg.textContent = "";

            // 渲染印盘
            board.innerHTML = "";
            slots.forEach((_, i) => {
                const slot = document.createElement("div");
                slot.className = "print-slot";
                slot.dataset.index = i;
                slot.addEventListener("click", () => removeFromSlot(i));
                board.appendChild(slot);
            });

            // 渲染打乱顺序的活字块
            typeBox.innerHTML = "";
            shuffle(poem.text.split("")).forEach(ch => {
                const block = document.createElement("div");
                block.className = "movable-type";
                block.textContent = ch;
                block.dataset.char = ch;
                block.addEventListener("click", () => placeChar(block));
                typeBox.appendChild(block);
            });
        }

        function placeChar(block) {
            const emptyIndex = slots.findIndex(s => s === null);
            if (emptyIndex === -1) {
                msg.textContent = "印盘排满啦，点击印盘里的字可以退回～";
                msg.style.color = "#c0392b";
                return;
            }
            slots[emptyIndex] = { char: block.dataset.char };
            block.classList.add("used");
            block.dataset.slot = emptyIndex;
            const slotEl = board.children[emptyIndex];
            slotEl.textContent = block.dataset.char;
            slotEl.classList.add("filled");
            msg.textContent = "";
        }

        function removeFromSlot(i) {
            if (!slots[i]) return;
            const ch = slots[i].char;
            slots[i] = null;
            const slotEl = board.children[i];
            slotEl.textContent = "";
            slotEl.classList.remove("filled");
            // 找回对应的活字块恢复
            const block = [...typeBox.children].find(b => b.dataset.char === ch && b.dataset.slot == i);
            if (block) {
                block.classList.remove("used");
                delete block.dataset.slot;
            }
        }

        function resetBoard() {
            loadPoem(current);
        }

        function inkPrint() {
            if (slots.some(s => s === null)) {
                msg.textContent = "先把印盘排满再刷墨哦！";
                msg.style.color = "#c0392b";
                return;
            }
            const arranged = slots.map(s => s.char).join("");
            if (arranged === current.text) {
                // 印刷成功：卷轴显字 + 盖印章 + 撒花 + 音效
                printResult.textContent = current.text;
                scrollArea.classList.add("printed");
                poemSource.textContent = current.source;
                msg.textContent = "印刷成功！这排版手艺，毕昇看了都要夸你！";
                msg.style.color = "#28a745";
                if (typeof SFX !== "undefined") SFX.print();
                if (typeof confettiBurst === "function") confettiBurst(80);
                if (typeof showSeal === "function") showSeal("印成", scrollArea);
                if (typeof awardBadge === "function") awardBadge("yinshua");
            } else {
                board.classList.remove("shake");
                void board.offsetWidth; // 重新触发抖动动画
                board.classList.add("shake");
                msg.textContent = "咦，顺序好像不对？读一读这句诗，再调整一下吧～";
                msg.style.color = "#c0392b";
            }
        }

        inkBtn.addEventListener("click", inkPrint);
        resetBtn.addEventListener("click", resetBoard);
        nextBtn.addEventListener("click", () => {
            const others = poems.filter(p => p !== current);
            loadPoem(others[Math.floor(Math.random() * others.length)]);
        });

        loadPoem(poems[0]);
    })();
    </script>
</body>
</html>
